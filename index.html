<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Rose on the Bench — Animation</title>
  <style>
    :root { --accent: #e07a93; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: radial-gradient(120% 120% at 50% 0%, #2a141b 0%, #160a0f 60%, #0d0609 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; gap: 22px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f3d7df;
    }
    .stage {
      position: relative;
      width: min(92vw, 1100px);
      aspect-ratio: 16 / 9;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 30px 80px -20px rgba(224,122,147,0.35), 0 0 0 1px rgba(255,255,255,0.05);
    }
    canvas { display: block; width: 100%; height: 100%; }
    .title {
      position: absolute; left: 26px; bottom: 22px;
      font-size: clamp(13px, 1.6vw, 20px); letter-spacing: 0.18em;
      text-transform: uppercase; font-weight: 300;
      color: rgba(255,255,255,0.82);
      text-shadow: 0 2px 12px rgba(0,0,0,0.45);
      pointer-events: none;
    }
    .controls { display: flex; gap: 14px; align-items: center; }
    button {
      background: rgba(255,255,255,0.06); color: #f3d7df;
      border: 1px solid rgba(224,122,147,0.5); padding: 9px 22px;
      border-radius: 30px; cursor: pointer; font-size: 14px; letter-spacing: 0.05em;
      backdrop-filter: blur(6px); transition: all .2s ease;
    }
    button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
    .hint { font-size: 12px; opacity: 0.5; letter-spacing: 0.04em; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="c" width="1280" height="720"></canvas>
    <div class="title">The Rose on the Bench</div>
  </div>
  <div class="controls">
    <button id="btnPlay">⏸ Pausa</button>
    <button id="btnReplay">↺ Replay</button>
  </div>
  <div class="hint">Animazione 2D in Canvas · ciclo continuo</div>
  <script src="animation.js"></script>
</body>
</html>
